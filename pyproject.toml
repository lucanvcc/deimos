[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deimos"
version = "0.1.0"
description = "Project Deimos: a transit search that found exoplanet candidates in Kepler Bonus light curves, with paired controls and held-back data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luca Novac" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.14",
    "astropy>=6.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
pixel = ["lightkurve>=2.4"]

[project.scripts]
deimos = "deimos.cli:main"

[tool.setuptools.packages.find]
include = ["deimos*"]

[tool.setuptools.package-data]
deimos = ["science-config.json", "frozen-pins.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
